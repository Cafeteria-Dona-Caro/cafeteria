<!DOCTYPE html>
<html lang="es" class="auth-pendiente">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mesero · Café de Caro</title>
  <meta name="theme-color" content="#e94560">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CafeDeCaro">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/pwa.js" defer></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="index.html">
      <span class="brand-logo">☕</span>
      <div>
        <h1>Mesero</h1>
        <p class="sub">Tomar y gestionar pedidos por mesa</p>
      </div>
    </a>
    <nav id="navPersonal" class="nav" aria-label="Pantallas"></nav>
    <div class="user-box">
      <span id="userEmail"></span>
      <span id="userRole"></span>
      <button id="logoutBtn" class="btn btn-fantasma btn-sm">Salir</button>
    </div>
  </header>

  <main>
    <div class="grid-2 lado-ancho">
      <!-- Pedido actual -->
      <section class="card">
        <div class="card-title">Pedido de la mesa</div>

        <form id="formMesa" class="grid-2" style="gap:.5rem;">
          <div>
            <label for="mesaInput" style="margin-top:0;">Mesa</label>
            <input id="mesaInput" type="text" maxlength="20" placeholder="Ej. PB-01" autocomplete="off">
          </div>
          <div>
            <label for="clienteInput" style="margin-top:0;">Cliente (opcional)</label>
            <input id="clienteInput" type="text" maxlength="60" placeholder="Ej. Juan">
          </div>
          <button type="submit" class="btn btn-primario" style="grid-column:1/-1;">Abrir pedido de la mesa</button>
        </form>

        <div id="infoOrden" class="fila-entre" style="margin-top:1rem;" hidden>
          <div>
            <div id="ordenTitulo" style="font-family:var(--fuente-titulos);font-weight:600;"></div>
            <div id="ordenMeta" class="chico tenue"></div>
          </div>
          <div id="ordenEstado"></div>
        </div>

        <div id="items" class="lista" style="margin-top:1rem;"></div>
        <div id="lineaTotal" class="total-linea" hidden><span>Total</span><span id="total">$0.00</span></div>

        <button id="btnCerrar" class="btn btn-ambar btn-bloque" style="margin-top:1rem;" disabled>Cerrar cuenta (pasar a caja)</button>
        <div id="statusBox" class="status" hidden></div>
      </section>

      <!-- Menú -->
      <section class="card">
        <div class="card-title">Agregar productos <span class="chico tenue">Toca para agregar 1</span></div>
        <input id="buscar" type="search" placeholder="Buscar producto…" style="margin-bottom:.75rem;">
        <div id="productos"><div class="vacio">Cargando menú…</div></div>
      </section>
    </div>
  </main>

  <script type="module">
    import {
      getDocs, addDoc, updateDoc, deleteDoc, onSnapshot, query, where, orderBy, doc, serverTimestamp,
      productosRef, ordenesRef, ordenRef, itemsRef
    } from "./js/firebase-config.js";
    import { verificarAcceso, montarEncabezado } from "./js/auth-guard.js";
    import {
      h, reemplazar, formatearPrecio, formatearHora, precioProducto, importeItem,
      pildoraEstado, mostrarEstado
    } from "./js/utils.js";

    const usuario = await verificarAcceso(["admin", "mesero", "caja"]);
    montarEncabezado(usuario);

    const formMesa = document.getElementById("formMesa");
    const mesaInput = document.getElementById("mesaInput");
    const clienteInput = document.getElementById("clienteInput");
    const infoOrden = document.getElementById("infoOrden");
    const ordenTitulo = document.getElementById("ordenTitulo");
    const ordenMeta = document.getElementById("ordenMeta");
    const ordenEstado = document.getElementById("ordenEstado");
    const itemsEl = document.getElementById("items");
    const lineaTotal = document.getElementById("lineaTotal");
    const totalEl = document.getElementById("total");
    const btnCerrar = document.getElementById("btnCerrar");
    const statusBox = document.getElementById("statusBox");
    const productosEl = document.getElementById("productos");
    const buscar = document.getElementById("buscar");

    let ordenId = null;
    let orden = null;
    let desuscribirOrden = null;
    let desuscribirItems = null;
    let productos = [];

    /* ─── Menú ─── */
    async function cargarProductos() {
      try {
        const snap = await getDocs(productosRef());
        productos = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .filter(p => p.isActive !== false && p.name)
          .sort((a, b) => (a.category || "").localeCompare(b.category || "") || a.name.localeCompare(b.name));
        pintarProductos();
      } catch (err) {
        console.error(err);
        reemplazar(productosEl, h("div", { class: "vacio" }, "Error al cargar el menú."));
      }
    }

    function pintarProductos() {
      const texto = buscar.value.trim().toLowerCase();
      const visibles = productos.filter(p => !texto || p.name.toLowerCase().includes(texto));
      if (!visibles.length) {
        reemplazar(productosEl, h("div", { class: "vacio" }, "Sin resultados."));
        return;
      }
      const grupos = new Map();
      visibles.forEach(p => {
        const c = p.category || "Otros";
        if (!grupos.has(c)) grupos.set(c, []);
        grupos.get(c).push(p);
      });
      const nodos = [];
      for (const [cat, lista] of grupos) {
        nodos.push(h("h3", { class: "categoria-titulo" }, cat));
        nodos.push(h("div", { class: "productos-grid" }, lista.map(p =>
          h("button", { class: "producto-card", onclick: () => agregarItem(p) },
            h("span", { class: "nombre" }, p.name),
            h("span", { class: "precio" }, formatearPrecio(precioProducto(p)))
          )
        )));
      }
      reemplazar(productosEl, nodos);
    }

    buscar.addEventListener("input", pintarProductos);

    async function agregarItem(p) {
      if (!ordenId) {
        mostrarEstado(statusBox, "Primero abre el pedido de una mesa.", "error");
        mesaInput.focus();
        return;
      }
      if (orden?.status === "cerrada") {
        mostrarEstado(statusBox, "La cuenta ya está cerrada. Abre un pedido nuevo para esta mesa.", "error");
        return;
      }
      try {
        await addDoc(itemsRef(ordenId), {
          productId: p.id,
          productName: p.name,
          price: precioProducto(p),
          notes: "",
          createdAt: serverTimestamp()
        });
        mostrarEstado(statusBox, `Agregado: ${p.name}`, "ok");
      } catch (err) {
        console.error(err);
        mostrarEstado(statusBox, "Error al agregar el producto.", "error");
      }
    }

    /* ─── Abrir / crear pedido ─── */
    formMesa.addEventListener("submit", (e) => {
      e.preventDefault();
      const mesa = mesaInput.value.trim();
      if (!mesa) {
        mostrarEstado(statusBox, "Escribe el número de mesa.", "error");
        return;
      }
      abrirPedido(mesa, clienteInput.value.trim());
    });

    async function abrirPedido(mesa, cliente = "") {
      desuscribirOrden?.();
      desuscribirItems?.();
      ordenId = null;
      orden = null;
      mostrarEstado(statusBox, `Buscando pedido de la mesa ${mesa}…`, "info");

      try {
        const snap = await getDocs(query(ordenesRef(), where("tableNumber", "==", mesa)));
        const abierta = snap.docs.find(d => (d.data().status || "abierta") !== "cerrada");

        if (abierta) {
          ordenId = abierta.id;
          if (!clienteInput.value && abierta.data().customerName) {
            clienteInput.value = abierta.data().customerName;
          }
          mostrarEstado(statusBox, `Pedido abierto de la mesa ${mesa}.`, "ok");
        } else {
          const nueva = await addDoc(ordenesRef(), {
            tableNumber: mesa,
            customerName: cliente,
            status: "abierta",
            source: "mesero",
            paymentStatus: "pendiente",
            subtotal: 0,
            total: 0,
            createdBy: usuario.uid,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });
          ordenId = nueva.id;
          mostrarEstado(statusBox, `Nuevo pedido creado para la mesa ${mesa}.`, "ok");
        }

        const url = new URL(location.href);
        url.searchParams.set("mesa", mesa);
        history.replaceState(null, "", url);

        escucharOrden();
      } catch (err) {
        console.error(err);
        mostrarEstado(statusBox, "No se pudo abrir el pedido.", "error");
      }
    }

    function escucharOrden() {
      const id = ordenId;
      desuscribirOrden = onSnapshot(ordenRef(id), (snap) => {
        if (!snap.exists()) return;
        orden = snap.data();
        infoOrden.hidden = false;
        ordenTitulo.textContent = `Mesa ${orden.tableNumber || "—"}` + (orden.customerName ? ` · ${orden.customerName}` : "");
        ordenMeta.textContent = `Pedido #${id.slice(-6)} · ${formatearHora(orden.createdAt)}` +
          (orden.source === "cliente" ? " · pedido por QR" : "");
        reemplazar(ordenEstado, pildoraEstado(orden.status || "abierta"));
        btnCerrar.disabled = orden.status === "cerrada";
      });

      desuscribirItems = onSnapshot(query(itemsRef(id), orderBy("createdAt", "asc")), async (snap) => {
        let total = 0;
        const filas = snap.docs.map(d => {
          const it = d.data();
          total += importeItem(it);
          return h("div", { class: "item-fila" },
            h("div", { style: "min-width:0;" },
              h("div", { class: "nombre" }, (it.qty > 1 ? `${it.qty} × ` : "") + (it.productName || "Producto")),
              it.notes ? h("div", { class: "nota" }, "Nota: " + it.notes) : null
            ),
            h("div", { class: "fila" },
              h("span", { class: "precio" }, formatearPrecio(importeItem(it))),
              orden?.status !== "cerrada"
                ? h("button", {
                    class: "btn btn-fantasma btn-sm", "aria-label": "Quitar " + (it.productName || "producto"),
                    onclick: () => quitarItem(d.id, it.productName)
                  }, "✕")
                : null
            )
          );
        });

        reemplazar(itemsEl, filas.length ? filas : h("div", { class: "vacio" }, "Aún no hay productos en este pedido."));
        lineaTotal.hidden = false;
        totalEl.textContent = formatearPrecio(total);

        // Mantener el total de la orden sincronizado con sus ítems
        if (orden && id === ordenId && orden.total !== total) {
          try {
            await updateDoc(ordenRef(id), { subtotal: total, total, updatedAt: serverTimestamp() });
          } catch (err) {
            console.error("No se pudo actualizar el total:", err);
          }
        }
      });
    }

    async function quitarItem(itemId, nombre) {
      if (!confirm(`¿Quitar "${nombre || "producto"}" del pedido?`)) return;
      try {
        await deleteDoc(doc(itemsRef(ordenId), itemId));
        mostrarEstado(statusBox, "Producto quitado.", "ok");
      } catch (err) {
        console.error(err);
        mostrarEstado(statusBox, "No se pudo quitar el producto.", "error");
      }
    }

    /* ─── Cerrar cuenta ─── */
    btnCerrar.addEventListener("click", async () => {
      if (!ordenId) return;
      if (!confirm("¿Cerrar la cuenta de esta mesa? Ya no se podrán agregar productos.")) return;
      try {
        await updateDoc(ordenRef(ordenId), { status: "cerrada", updatedAt: serverTimestamp() });
        mostrarEstado(statusBox, "Cuenta cerrada. Lista para cobrar en caja.", "ok");
      } catch (err) {
        console.error(err);
        mostrarEstado(statusBox, "Error al cerrar la cuenta.", "error");
      }
    });

    await cargarProductos();

    // Si venimos del mapa de mesas: mesero.html?mesa=PB-01
    const mesaUrl = new URLSearchParams(location.search).get("mesa");
    if (mesaUrl) {
      mesaInput.value = mesaUrl.slice(0, 20);
      abrirPedido(mesaInput.value);
    }
  </script>
</body>
</html>
