<!DOCTYPE html>
<html lang="es" class="auth-pendiente" data-personal>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mesas · Café de Caro</title>
  <meta name="theme-color" content="#e94560">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CafeDeCaro">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/pwa.js" defer></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="index.html">
      <span class="brand-logo">☕</span>
      <div>
        <h1>Mapa de mesas</h1>
        <p class="sub">Planta baja · Planta alta · Balcón</p>
      </div>
    </a>
    <nav id="navPersonal" class="nav" aria-label="Pantallas"></nav>
    <div class="user-box">
      <span id="userEmail"></span>
      <span id="userRole"></span>
      <button id="logoutBtn" class="btn btn-fantasma btn-sm">Salir</button>
    </div>
  </header>

  <main>
    <div class="pila" style="margin-bottom:1rem;">
      <div id="filtros" class="chips">
        <button class="chip activo" data-area="todas">Todas</button>
        <button class="chip" data-area="PB">Planta baja</button>
        <button class="chip" data-area="PA">Planta alta</button>
        <button class="chip" data-area="B">Balcón</button>
      </div>
      <div class="fila chico">
        <span class="pill estado-nueva">Nuevo</span>
        <span class="pill estado-preparacion">En preparación</span>
        <span class="pill estado-lista">Listo</span>
        <span class="pill pago-pendiente">Por cobrar</span>
      </div>
    </div>
    <div id="areas" class="pila" style="gap:1.5rem;"></div>
    <div id="statusBox" class="status" hidden></div>
  </main>

  <script type="module" src="js/paginas/mesas.js"></script>
</body>
</html>
