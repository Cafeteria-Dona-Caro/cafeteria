<!DOCTYPE html>
<html lang="es" class="auth-pendiente">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mesas · Café de Caro</title>
  <meta name="theme-color" content="#e94560">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CafeDeCaro">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/pwa.js" defer></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="index.html">
      <span class="brand-logo">☕</span>
      <div>
        <h1>Mapa de mesas</h1>
        <p class="sub">Planta baja · Planta alta · Balcón</p>
      </div>
    </a>
    <nav id="navPersonal" class="nav" aria-label="Pantallas"></nav>
    <div class="user-box">
      <span id="userEmail"></span>
      <span id="userRole"></span>
      <button id="logoutBtn" class="btn btn-fantasma btn-sm">Salir</button>
    </div>
  </header>

  <main>
    <div class="pila" style="margin-bottom:1rem;">
      <div id="filtros" class="chips">
        <button class="chip activo" data-area="todas">Todas</button>
        <button class="chip" data-area="PB">Planta baja</button>
        <button class="chip" data-area="PA">Planta alta</button>
        <button class="chip" data-area="B">Balcón</button>
      </div>
      <div class="fila chico">
        <span class="pill estado-nueva">Nuevo</span>
        <span class="pill estado-preparacion">En preparación</span>
        <span class="pill estado-lista">Listo</span>
        <span class="pill pago-pendiente">Por cobrar</span>
      </div>
    </div>
    <div id="areas" class="pila" style="gap:1.5rem;"></div>
    <div id="statusBox" class="status" hidden></div>
  </main>

  <script type="module">
    import { onSnapshot, query, where, orderBy, Timestamp, ordenesRef } from "./js/firebase-config.js";
    import { verificarAcceso, montarEncabezado } from "./js/auth-guard.js";
    import { h, reemplazar, haceCuanto, formatearPrecio, mostrarEstado } from "./js/utils.js";

    const usuario = await verificarAcceso(["admin", "mesero", "caja"]);
    montarEncabezado(usuario);

    // Distribución del local
    const AREAS = [
      { id: "PB", nombre: "Planta baja", mesas: ["PB-01", "PB-02", "PB-03", "PB-04", "PB-05", "PB-06", "PB-07", "PB-08"] },
      { id: "PA", nombre: "Planta alta", mesas: ["PA-01", "PA-02", "PA-03", "PA-04", "PA-05", "PA-06"] },
      { id: "B",  nombre: "Balcón",      mesas: ["B-01", "B-02", "B-03", "B-04"] }
    ];

    const areasEl = document.getElementById("areas");
    const filtros = document.getElementById("filtros");
    const statusBox = document.getElementById("statusBox");

    let areaActiva = "todas";
    let porMesa = null; // null = todavía no llegan los datos

    filtros.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      areaActiva = chip.dataset.area;
      filtros.querySelectorAll(".chip").forEach(c => c.classList.toggle("activo", c === chip));
      pintar();
    });

    // Una sola suscripción a las órdenes de hoy (antes había una por mesa)
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);

    onSnapshot(
      query(ordenesRef(), where("createdAt", ">=", Timestamp.fromDate(hoy)), orderBy("createdAt", "asc")),
      (snap) => {
        porMesa = new Map();
        snap.docs.forEach(d => {
          const o = d.data();
          if (!o.tableNumber) return;
          const estado = o.status || "abierta";
          const porCobrar = estado === "cerrada" && (o.paymentStatus || "pendiente") !== "pagado";
          // Solo interesan pedidos activos o cuentas cerradas sin cobrar
          if (estado === "cerrada" && !porCobrar) {
            porMesa.delete(o.tableNumber);
            return;
          }
          porMesa.set(o.tableNumber, { ...o, porCobrar });
        });
        pintar();
      },
      (err) => {
        console.error(err);
        mostrarEstado(statusBox, "No se pudo leer el estado de las mesas.", "error");
      }
    );

    // Refrescar el tiempo transcurrido
    setInterval(pintar, 30000);

    function infoMesa(o) {
      if (!o) return { borde: "borde-libre", texto: "Libre" };
      if (o.porCobrar) return { borde: "borde-cancelada", texto: "Por cobrar" };
      switch (o.status || "abierta") {
        case "en_preparacion": return { borde: "borde-preparacion", texto: "En preparación" };
        case "lista": return { borde: "borde-lista", texto: "Listo para entregar" };
        default: return { borde: "borde-nueva", texto: "Pedido abierto" };
      }
    }

    function pintar() {
      if (!porMesa) {
        reemplazar(areasEl, h("div", { class: "vacio" }, "Cargando mesas…"));
        return;
      }
      const conocidas = new Set(AREAS.flatMap(a => a.mesas));
      const otras = [...porMesa.keys()].filter(m => !conocidas.has(m)).sort();

      const secciones = AREAS
        .filter(a => areaActiva === "todas" || a.id === areaActiva)
        .map(a => seccion(a.nombre, a.mesas));

      // Mesas escritas a mano que no están en el mapa (p. ej. "12" o "Barra")
      if (areaActiva === "todas" && otras.length) secciones.push(seccion("Otras mesas", otras));

      reemplazar(areasEl, secciones);
    }

    function seccion(nombre, mesas) {
      return h("section", {},
        h("h2", { class: "categoria-titulo" }, nombre),
        h("div", { class: "mesas-grid" }, mesas.map(m => {
          const o = porMesa.get(m);
          const info = infoMesa(o);
          return h("a", { class: "mesa-card " + info.borde, href: "mesero.html?mesa=" + encodeURIComponent(m) },
            h("span", { class: "nombre" }, m),
            h("span", { class: "detalle" }, info.texto + (o ? ` · ${haceCuanto(o.createdAt)}` : "")),
            o ? h("span", { class: "detalle" }, formatearPrecio(o.total ?? 0) + (o.customerName ? " · " + o.customerName : "")) : null
          );
        }))
      );
    }

    pintar();
  </script>
</body>
</html>
