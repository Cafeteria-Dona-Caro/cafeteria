<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Iniciar sesión · Café de Caro</title>
  <meta name="theme-color" content="#e94560">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CafeDeCaro">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/pwa.js" defer></script>
</head>
<body>
  <main class="centrado">
    <form id="loginForm" class="card caja-login" novalidate>
      <div class="brand" style="margin-bottom:1rem;">
        <span class="brand-logo">☕</span>
        <div>
          <h1>Iniciar sesión</h1>
          <p class="sub">Personal de Café de Caro</p>
        </div>
      </div>

      <label for="emailInput">Correo</label>
      <input id="emailInput" type="email" autocomplete="username" placeholder="mesero@cafecaro.com" required>

      <label for="passwordInput">Contraseña</label>
      <input id="passwordInput" type="password" autocomplete="current-password" placeholder="••••••••" required>

      <button id="loginBtn" type="submit" class="btn btn-primario btn-bloque" style="margin-top:1.25rem;">Entrar</button>

      <div id="statusBox" class="status" hidden></div>

      <p class="chico tenue centro" style="margin:1.25rem 0 0;">
        ¿Eres cliente? <a href="cliente.html">Haz tu pedido aquí</a> · <a href="index.html">Ver menú</a>
      </p>
    </form>
  </main>

  <script type="module">
    import { auth, signInWithEmailAndPassword, signOut } from "./js/firebase-config.js";
    import { obtenerSesion, INICIO_POR_ROL } from "./js/auth-guard.js";
    import { mostrarEstado } from "./js/utils.js";

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const loginBtn = document.getElementById("loginBtn");
    const statusBox = document.getElementById("statusBox");

    if (new URLSearchParams(location.search).get("error") === "sin-rol") {
      mostrarEstado(statusBox, "Tu cuenta no tiene un rol asignado. Pide al administrador que te lo asigne.", "error");
    }

    function redirigir(role) {
      const destino = INICIO_POR_ROL[role];
      if (destino) {
        window.location.replace(destino);
        return true;
      }
      return false;
    }

    // Si ya hay sesión con rol válido, entrar directo
    const sesion = await obtenerSesion();
    if (sesion?.perfil?.role) redirigir(sesion.perfil.role);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const pass = passwordInput.value;

      if (!email || !pass) {
        mostrarEstado(statusBox, "Escribe tu correo y contraseña.", "error");
        return;
      }

      loginBtn.disabled = true;
      mostrarEstado(statusBox, "Entrando…", "info");

      try {
        await signInWithEmailAndPassword(auth, email, pass);
        const s = await obtenerSesion();
        if (!s?.perfil?.role || !redirigir(s.perfil.role)) {
          await signOut(auth);
          mostrarEstado(statusBox, "Tu cuenta no tiene un rol asignado. Contacta al administrador.", "error");
        }
      } catch (err) {
        console.error(err);
        const code = err?.code || "";
        const msg = code === "auth/too-many-requests"
          ? "Demasiados intentos. Espera unos minutos."
          : code === "auth/network-request-failed"
            ? "Sin conexión. Revisa tu internet."
            : "Correo o contraseña incorrectos.";
        mostrarEstado(statusBox, msg, "error");
      } finally {
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
