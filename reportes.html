<!DOCTYPE html>
<html lang="es" class="auth-pendiente">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reportes · Café de Caro</title>
  <meta name="theme-color" content="#e94560">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CafeDeCaro">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/pwa.js" defer></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="index.html">
      <span class="brand-logo">☕</span>
      <div>
        <h1>Reportes</h1>
        <p class="sub">Ventas por periodo y forma de pago</p>
      </div>
    </a>
    <nav id="navPersonal" class="nav" aria-label="Pantallas"></nav>
    <div class="user-box">
      <span id="userEmail"></span>
      <span id="userRole"></span>
      <button id="logoutBtn" class="btn btn-fantasma btn-sm">Salir</button>
    </div>
  </header>

  <main class="pila" style="gap:1rem;">
    <section class="card">
      <div class="card-title">Periodo</div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end;">
        <div>
          <label for="periodo" style="margin-top:0;">Rango</label>
          <select id="periodo">
            <option value="hoy">Hoy</option>
            <option value="ayer">Ayer</option>
            <option value="7dias">Últimos 7 días</option>
            <option value="estemes">Este mes</option>
            <option value="rango">Personalizado</option>
          </select>
        </div>
        <div>
          <label for="desde" style="margin-top:0;">Desde</label>
          <input id="desde" type="date" disabled>
        </div>
        <div>
          <label for="hasta" style="margin-top:0;">Hasta</label>
          <input id="hasta" type="date" disabled>
        </div>
        <button id="btnActualizar" class="btn btn-primario">Actualizar</button>
      </div>
      <p id="infoPeriodo" class="chico tenue" style="margin:.75rem 0 0;"></p>
      <div id="statusBox" class="status" hidden></div>
    </section>

    <section class="card">
      <div class="card-title">Resumen</div>
      <div class="kpis">
        <div class="kpi"><div class="etiqueta">Total de ventas</div><div id="kTotal" class="valor">$0.00</div></div>
        <div class="kpi"><div class="etiqueta">Tickets</div><div id="kTickets" class="valor">0</div></div>
        <div class="kpi"><div class="etiqueta">Ticket promedio</div><div id="kPromedio" class="valor">$0.00</div></div>
        <div class="kpi"><div class="etiqueta">Pagadas</div><div id="kPagadas" class="valor">0</div></div>
      </div>
      <div id="metodos" class="lista" style="margin-top:1rem;"></div>
    </section>

    <section class="card">
      <div class="card-title">Órdenes del periodo</div>
      <div class="tabla-wrap">
        <table>
          <thead>
            <tr>
              <th>Fecha</th><th>Mesa</th><th>Cliente</th><th>Estado</th><th>Pago</th><th>Método</th><th class="num">Total</th>
            </tr>
          </thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module">
    import { getDocs, query, where, orderBy, Timestamp, ordenesRef, itemsRef } from "./js/firebase-config.js";
    import { verificarAcceso, montarEncabezado } from "./js/auth-guard.js";
    import {
      h, reemplazar, formatearPrecio, formatearFecha, importeItem,
      pildoraEstado, pildoraPago, mostrarEstado
    } from "./js/utils.js";

    const usuario = await verificarAcceso(["admin", "caja"]);
    montarEncabezado(usuario);

    const METODOS = [
      ["efectivo", "Efectivo"], ["tarjeta", "Tarjeta"], ["transferencia", "Transferencia"],
      ["vales", "Vales"], ["mixto", "Mixto"], ["", "Sin método"]
    ];

    const periodo = document.getElementById("periodo");
    const desde = document.getElementById("desde");
    const hasta = document.getElementById("hasta");
    const btnActualizar = document.getElementById("btnActualizar");
    const infoPeriodo = document.getElementById("infoPeriodo");
    const statusBox = document.getElementById("statusBox");
    const tabla = document.getElementById("tabla");
    const metodosEl = document.getElementById("metodos");

    const inicioDia = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0, 0);
    const finDia = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59, 999);
    const aInput = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

    function aplicarPreset(valor) {
      const hoy = new Date();
      let ini, fin;
      if (valor === "hoy") { ini = hoy; fin = hoy; }
      else if (valor === "ayer") { ini = new Date(hoy); ini.setDate(ini.getDate() - 1); fin = ini; }
      else if (valor === "7dias") { ini = new Date(hoy); ini.setDate(ini.getDate() - 6); fin = hoy; }
      else if (valor === "estemes") { ini = new Date(hoy.getFullYear(), hoy.getMonth(), 1); fin = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0); }
      else return;
      desde.value = aInput(ini);
      hasta.value = aInput(fin);
    }

    periodo.addEventListener("change", () => {
      const personalizado = periodo.value === "rango";
      desde.disabled = hasta.disabled = !personalizado;
      if (!personalizado) {
        aplicarPreset(periodo.value);
        cargar();
      }
    });
    btnActualizar.addEventListener("click", cargar);

    async function cargar() {
      if (!desde.value || !hasta.value) {
        mostrarEstado(statusBox, "Selecciona las fechas Desde y Hasta.", "error");
        return;
      }
      const ini = inicioDia(new Date(desde.value + "T00:00:00"));
      const fin = finDia(new Date(hasta.value + "T00:00:00"));
      if (ini > fin) {
        mostrarEstado(statusBox, "La fecha Desde no puede ser posterior a Hasta.", "error");
        return;
      }
      const opt = { day: "2-digit", month: "short", year: "numeric" };
      infoPeriodo.textContent = `Del ${ini.toLocaleDateString("es-MX", opt)} al ${fin.toLocaleDateString("es-MX", opt)}.`;

      btnActualizar.disabled = true;
      mostrarEstado(statusBox, "Cargando…", "info");
      try {
        const snap = await getDocs(query(
          ordenesRef(),
          where("createdAt", ">=", Timestamp.fromDate(ini)),
          where("createdAt", "<=", Timestamp.fromDate(fin)),
          orderBy("createdAt", "asc")
        ));
        const ordenes = snap.docs.map(d => ({ id: d.id, ...d.data() }));

        // Pedidos que nadie ha abierto todavía (p. ej. por QR) pueden tener total 0:
        // se calcula a partir de sus ítems.
        await Promise.all(ordenes.map(async o => {
          if (!(o.total > 0)) {
            const items = await getDocs(itemsRef(o.id));
            o.total = items.docs.reduce((s, d) => s + importeItem(d.data()), 0);
          }
        }));

        pintarResumen(ordenes);
        pintarTabla(ordenes);
        mostrarEstado(statusBox, `${ordenes.length} órdenes en el periodo.`, "ok");
      } catch (err) {
        console.error(err);
        mostrarEstado(statusBox, "Error al cargar el reporte.", "error");
      } finally {
        btnActualizar.disabled = false;
      }
    }

    function pintarResumen(ordenes) {
      let total = 0, tickets = 0, pagadas = 0;
      const porMetodo = Object.fromEntries(METODOS.map(([k]) => [k, 0]));

      ordenes.forEach(o => {
        const t = Number(o.total) || 0;
        if (!t) return;
        total += t;
        tickets++;
        if (o.paymentStatus === "pagado") pagadas++;
        const m = o.paymentMethod in porMetodo ? o.paymentMethod : "";
        porMetodo[m] += t;
      });

      document.getElementById("kTotal").textContent = formatearPrecio(total);
      document.getElementById("kTickets").textContent = tickets;
      document.getElementById("kPromedio").textContent = formatearPrecio(tickets ? total / tickets : 0);
      document.getElementById("kPagadas").textContent = pagadas;

      reemplazar(metodosEl, METODOS.map(([k, nombre]) =>
        h("div", { class: "item-fila" },
          h("span", { class: "nombre" }, nombre),
          h("span", { class: "precio" }, formatearPrecio(porMetodo[k]))
        )
      ));
    }

    function pintarTabla(ordenes) {
      if (!ordenes.length) {
        reemplazar(tabla, h("tr", {}, h("td", { colspan: "7", class: "vacio" }, "No hay órdenes en este periodo.")));
        return;
      }
      reemplazar(tabla, ordenes.map(o =>
        h("tr", {},
          h("td", {}, formatearFecha(o.createdAt)),
          h("td", {}, o.tableNumber || "—"),
          h("td", {}, o.customerName || ""),
          h("td", {}, pildoraEstado(o.status || "abierta")),
          h("td", {}, pildoraPago(o.paymentStatus)),
          h("td", {}, o.paymentMethod || "—"),
          h("td", { class: "num" }, formatearPrecio(o.total))
        )
      ));
    }

    aplicarPreset("hoy");
    cargar();
  </script>
</body>
</html>
