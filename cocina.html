<!DOCTYPE html>
<html lang="es" class="auth-pendiente">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cocina · Café de Caro</title>
  <meta name="theme-color" content="#e94560">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CafeDeCaro">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/pwa.js" defer></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="index.html">
      <span class="brand-logo">☕</span>
      <div>
        <h1>Cocina</h1>
        <p class="sub" id="subtitulo">Pedidos en tiempo real</p>
      </div>
    </a>
    <nav id="navPersonal" class="nav" aria-label="Pantallas"></nav>
    <div class="user-box">
      <button id="btnSonido" class="btn btn-fantasma btn-sm" title="Activar sonido de nuevos pedidos">🔇 Sonido</button>
      <span id="userEmail"></span>
      <span id="userRole"></span>
      <button id="logoutBtn" class="btn btn-fantasma btn-sm">Salir</button>
    </div>
  </header>

  <main>
    <div class="kds">
      <section class="kds-columna col-nueva">
        <h2>Nuevos <span id="cNuevas" class="pill estado-nueva contador">0</span></h2>
        <div id="listaNuevas" class="lista"></div>
      </section>
      <section class="kds-columna col-preparacion">
        <h2>En preparación <span id="cPrep" class="pill estado-preparacion contador">0</span></h2>
        <div id="listaPrep" class="lista"></div>
      </section>
      <section class="kds-columna col-lista">
        <h2>Listos <span id="cListas" class="pill estado-lista contador">0</span></h2>
        <div id="listaListas" class="lista"></div>
      </section>
    </div>
    <div id="statusBox" class="status" hidden></div>
  </main>

  <aside id="panel" class="panel-detalle" hidden aria-live="polite">
    <div class="fila-entre" style="margin-bottom:.5rem;">
      <h2 id="pTitulo" style="margin:0;"></h2>
      <button id="pCerrar" class="btn btn-fantasma btn-sm" aria-label="Cerrar detalle">✕</button>
    </div>
    <div id="pMeta" class="chico tenue"></div>
    <div id="pEstado" style="margin:.5rem 0;"></div>
    <div id="pItems" class="lista"></div>
    <div class="total-linea"><span>Total</span><span id="pTotal">$0.00</span></div>
    <div id="pBotones" class="pila" style="margin-top:1rem;"></div>
  </aside>

  <script type="module">
    import {
      onSnapshot, query, where, orderBy, updateDoc, serverTimestamp, Timestamp,
      SUCURSAL_ID, ordenesRef, ordenRef, itemsRef
    } from "./js/firebase-config.js";
    import { verificarAcceso, montarEncabezado } from "./js/auth-guard.js";
    import {
      h, reemplazar, formatearPrecio, formatearHora, haceCuanto, importeItem,
      pildoraEstado, mostrarEstado, ESTADOS_ORDEN
    } from "./js/utils.js";

    const usuario = await verificarAcceso(["admin", "cocina"]);
    montarEncabezado(usuario);
    document.getElementById("subtitulo").textContent = "Sucursal: " + SUCURSAL_ID;

    const listas = {
      abierta: document.getElementById("listaNuevas"),
      en_preparacion: document.getElementById("listaPrep"),
      lista: document.getElementById("listaListas")
    };
    const contadores = {
      abierta: document.getElementById("cNuevas"),
      en_preparacion: document.getElementById("cPrep"),
      lista: document.getElementById("cListas")
    };
    const bordes = { abierta: "borde-nueva", en_preparacion: "borde-preparacion", lista: "borde-lista" };
    const vacios = { abierta: "Sin pedidos nuevos.", en_preparacion: "Nada en preparación.", lista: "Nada listo por entregar." };

    const statusBox = document.getElementById("statusBox");
    const panel = document.getElementById("panel");
    const pTitulo = document.getElementById("pTitulo");
    const pMeta = document.getElementById("pMeta");
    const pEstado = document.getElementById("pEstado");
    const pItems = document.getElementById("pItems");
    const pTotal = document.getElementById("pTotal");
    const pBotones = document.getElementById("pBotones");
    const btnSonido = document.getElementById("btnSonido");

    let ordenes = new Map();
    let seleccionada = null;
    let desuscribirItems = null;
    const recienLlegadas = new Set();

    /* ─── Sonido (los navegadores exigen un toque del usuario para activarlo) ─── */
    let audioCtx = null;
    btnSonido.addEventListener("click", () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        btnSonido.textContent = "🔔 Sonido";
        beep();
      } else {
        audioCtx.close();
        audioCtx = null;
        btnSonido.textContent = "🔇 Sonido";
      }
    });

    function beep() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      [0, 0.18].forEach((retraso, i) => {
        const osc = audioCtx.createOscillator();
        const gan = audioCtx.createGain();
        osc.frequency.value = i ? 1175 : 880;
        gan.gain.setValueAtTime(0.0001, t + retraso);
        gan.gain.exponentialRampToValueAtTime(0.3, t + retraso + 0.02);
        gan.gain.exponentialRampToValueAtTime(0.0001, t + retraso + 0.16);
        osc.connect(gan).connect(audioCtx.destination);
        osc.start(t + retraso);
        osc.stop(t + retraso + 0.18);
      });
    }

    /* ─── Órdenes activas (no cerradas) de las últimas 24 h ─── */
    const desde = Timestamp.fromDate(new Date(Date.now() - 24 * 60 * 60 * 1000));
    let primeraCarga = true;

    onSnapshot(
      query(ordenesRef(), where("createdAt", ">=", desde), orderBy("createdAt", "asc")),
      (snap) => {
        snap.docChanges().forEach(cambio => {
          if (cambio.type === "added" && !primeraCarga && (cambio.doc.data().status || "abierta") === "abierta") {
            recienLlegadas.add(cambio.doc.id);
            beep();
          }
        });
        primeraCarga = false;
        ordenes = new Map(snap.docs.map(d => [d.id, d.data()]));
        pintarColumnas();
        if (seleccionada) {
          const o = ordenes.get(seleccionada);
          if (!o || !listas[o.status || "abierta"]) cerrarPanel();
          else pintarCabeceraPanel(seleccionada, o);
        }
      },
      (err) => {
        console.error(err);
        mostrarEstado(statusBox, "Error leyendo pedidos. Revisa tu conexión.", "error");
      }
    );

    // Refrescar los "hace X min" cada 30 s
    setInterval(pintarColumnas, 30000);

    function pintarColumnas() {
      const grupos = { abierta: [], en_preparacion: [], lista: [] };
      for (const [id, o] of ordenes) {
        const estado = o.status || "abierta";
        if (grupos[estado]) grupos[estado].push([id, o]);
      }
      for (const estado of Object.keys(grupos)) {
        contadores[estado].textContent = grupos[estado].length;
        reemplazar(listas[estado], grupos[estado].length
          ? grupos[estado].map(([id, o]) => tarjeta(id, o, estado))
          : h("div", { class: "vacio" }, vacios[estado]));
      }
    }

    function tarjeta(id, o, estado) {
      const nueva = recienLlegadas.has(id);
      if (nueva) setTimeout(() => recienLlegadas.delete(id), 5000);
      return h("button", {
        class: `orden-card ${bordes[estado]}` + (id === seleccionada ? " seleccionada" : "") + (nueva ? " nueva-animada" : ""),
        onclick: () => abrirPanel(id)
      },
        h("div", { class: "fila-entre" },
          h("span", { class: "titulo" }, "Mesa " + (o.tableNumber || "?")),
          h("span", { class: "meta" }, `${formatearHora(o.createdAt)} · hace ${haceCuanto(o.createdAt) || "0s"}`)
        ),
        h("div", { class: "meta" },
          (o.customerName || "Sin nombre") + " · " + (o.source === "cliente" ? "QR cliente" : "Mesero")
        )
      );
    }

    /* ─── Panel de detalle ─── */
    function abrirPanel(id) {
      const o = ordenes.get(id);
      if (!o) return;
      seleccionada = id;
      panel.hidden = false;
      pintarCabeceraPanel(id, o);
      pintarColumnas();

      desuscribirItems?.();
      reemplazar(pItems, h("div", { class: "vacio" }, "Cargando productos…"));
      desuscribirItems = onSnapshot(query(itemsRef(id), orderBy("createdAt", "asc")), (snap) => {
        let total = 0;
        const filas = snap.docs.map(d => {
          const it = d.data();
          total += importeItem(it);
          return h("div", { class: "item-fila" },
            h("div", {},
              h("div", { class: "nombre" }, `${it.qty || 1} × ${it.productName || "Producto"}`),
              it.notes ? h("div", { class: "nota" }, "Nota: " + it.notes) : null
            ),
            h("span", { class: "precio" }, formatearPrecio(importeItem(it)))
          );
        });
        reemplazar(pItems, filas.length ? filas : h("div", { class: "vacio" }, "Sin productos."));
        pTotal.textContent = formatearPrecio(total);
      }, (err) => {
        console.error(err);
        reemplazar(pItems, h("div", { class: "vacio" }, "Error al cargar productos."));
      });
    }

    function pintarCabeceraPanel(id, o) {
      const estado = o.status || "abierta";
      pTitulo.textContent = "Mesa " + (o.tableNumber || "?");
      pMeta.textContent = `Pedido #${id.slice(-6)} · ${o.customerName || "Sin nombre"} · ` +
        `${o.source === "cliente" ? "QR cliente" : "Mesero"} · ${formatearHora(o.createdAt)}`;
      reemplazar(pEstado, pildoraEstado(estado));

      const botones = [];
      if (estado === "abierta") {
        botones.push(h("button", { class: "btn btn-ambar", onclick: () => cambiarEstado(id, "en_preparacion") }, "Empezar a preparar"));
      }
      if (estado === "en_preparacion") {
        botones.push(h("button", { class: "btn btn-exito", onclick: () => cambiarEstado(id, "lista") }, "Marcar como listo"));
        botones.push(h("button", { class: "btn btn-fantasma btn-sm", onclick: () => cambiarEstado(id, "abierta") }, "↩ Regresar a nuevos"));
      }
      if (estado === "lista") {
        botones.push(h("button", {
          class: "btn btn-primario",
          onclick: () => confirm("¿Marcar como entregado? El pedido se cierra y pasa a caja.") && cambiarEstado(id, "cerrada")
        }, "Entregado (cerrar pedido)"));
        botones.push(h("button", { class: "btn btn-fantasma btn-sm", onclick: () => cambiarEstado(id, "en_preparacion") }, "↩ Regresar a preparación"));
      }
      reemplazar(pBotones, botones);
    }

    function cerrarPanel() {
      seleccionada = null;
      desuscribirItems?.();
      desuscribirItems = null;
      panel.hidden = true;
      pintarColumnas();
    }
    document.getElementById("pCerrar").addEventListener("click", cerrarPanel);

    async function cambiarEstado(id, nuevo) {
      try {
        await updateDoc(ordenRef(id), { status: nuevo, updatedAt: serverTimestamp() });
        mostrarEstado(statusBox, `Pedido #${id.slice(-6)} → ${ESTADOS_ORDEN[nuevo].texto}`, "ok");
      } catch (err) {
        console.error(err);
        mostrarEstado(statusBox, "No se pudo actualizar el estado.", "error");
      }
    }
  </script>
</body>
</html>
