<!DOCTYPE html>
<html lang="es" class="auth-pendiente">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Caja · Café de Caro</title>
  <meta name="theme-color" content="#e94560">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CafeDeCaro">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/pwa.js" defer></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="index.html">
      <span class="brand-logo">☕</span>
      <div>
        <h1>Caja</h1>
        <p class="sub">Cobros y estado de las cuentas</p>
      </div>
    </a>
    <nav id="navPersonal" class="nav" aria-label="Pantallas"></nav>
    <div class="user-box">
      <span id="userEmail"></span>
      <span id="userRole"></span>
      <button id="logoutBtn" class="btn btn-fantasma btn-sm">Salir</button>
    </div>
  </header>

  <main>
    <div class="grid-2">
      <section class="card">
        <div class="card-title">Órdenes <span class="chico tenue">últimos 30 días</span></div>
        <div id="filtros" class="chips" style="margin-bottom:.75rem;">
          <button class="chip activo" data-filtro="pendientes">Por cobrar</button>
          <button class="chip" data-filtro="abiertas">Abiertas</button>
          <button class="chip" data-filtro="pagadas">Pagadas</button>
          <button class="chip" data-filtro="todas">Todas</button>
        </div>
        <div id="ordenes" class="lista"><div class="vacio">Cargando órdenes…</div></div>
      </section>

      <section class="card">
        <div class="card-title">Detalle de la cuenta</div>
        <div id="detalleVacio" class="vacio">Selecciona una orden para ver su detalle.</div>

        <div id="detalle" hidden>
          <div class="fila-entre">
            <div>
              <div id="dTitulo" style="font-family:var(--fuente-titulos);font-weight:600;font-size:1.1rem;"></div>
              <div id="dMeta" class="chico tenue"></div>
            </div>
            <div id="dPildoras" class="fila"></div>
          </div>

          <div id="dItems" class="lista" style="margin-top:1rem;"></div>
          <div class="total-linea"><span>Total</span><span id="dTotal">$0.00</span></div>

          <div class="grid-2" style="gap:.5rem;margin-top:.5rem;">
            <div>
              <label for="pagoEstado">Estado de pago</label>
              <select id="pagoEstado">
                <option value="pendiente">Pendiente</option>
                <option value="pagado">Pagado</option>
              </select>
            </div>
            <div>
              <label for="pagoMetodo">Forma de pago</label>
              <select id="pagoMetodo">
                <option value="">— Seleccionar —</option>
                <option value="efectivo">Efectivo</option>
                <option value="tarjeta">Tarjeta</option>
                <option value="transferencia">Transferencia</option>
                <option value="vales">Vales</option>
                <option value="mixto">Mixto</option>
              </select>
            </div>
          </div>

          <button id="btnGuardar" class="btn btn-primario btn-bloque" style="margin-top:1rem;">Guardar cobro</button>
          <p id="permisos" class="chico tenue" style="margin:.5rem 0 0;"></p>
        </div>

        <div id="statusBox" class="status" hidden></div>
      </section>
    </div>
  </main>

  <script type="module">
    import {
      onSnapshot, query, where, orderBy, getDocs, updateDoc, serverTimestamp, Timestamp,
      ordenesRef, ordenRef, itemsRef
    } from "./js/firebase-config.js";
    import { verificarAcceso, montarEncabezado } from "./js/auth-guard.js";
    import {
      h, reemplazar, formatearPrecio, formatearFecha, importeItem,
      pildoraEstado, pildoraPago, mostrarEstado
    } from "./js/utils.js";

    const usuario = await verificarAcceso(["admin", "caja"]);
    montarEncabezado(usuario);

    // Solo el administrador puede registrar cobros (misma regla en firestore.rules).
    const puedeCobrar = usuario.role === "admin";

    const filtros = document.getElementById("filtros");
    const ordenesEl = document.getElementById("ordenes");
    const detalleVacio = document.getElementById("detalleVacio");
    const detalle = document.getElementById("detalle");
    const dTitulo = document.getElementById("dTitulo");
    const dMeta = document.getElementById("dMeta");
    const dPildoras = document.getElementById("dPildoras");
    const dItems = document.getElementById("dItems");
    const dTotal = document.getElementById("dTotal");
    const pagoEstado = document.getElementById("pagoEstado");
    const pagoMetodo = document.getElementById("pagoMetodo");
    const btnGuardar = document.getElementById("btnGuardar");
    const permisos = document.getElementById("permisos");
    const statusBox = document.getElementById("statusBox");

    pagoEstado.disabled = pagoMetodo.disabled = btnGuardar.disabled = !puedeCobrar;
    permisos.textContent = puedeCobrar
      ? "El total se recalcula a partir de los productos al guardar."
      : "Tu rol es de solo lectura: solo el administrador puede registrar cobros.";

    let ordenes = [];
    let filtro = "pendientes";
    let seleccionada = null;
    let totalSeleccionada = 0;

    /* ─── Filtros ─── */
    filtros.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      filtro = chip.dataset.filtro;
      filtros.querySelectorAll(".chip").forEach(c => c.classList.toggle("activo", c === chip));
      pintarLista();
    });

    /* ─── Órdenes en tiempo real ─── */
    const desde = Timestamp.fromDate(new Date(Date.now() - 30 * 24 * 60 * 60 * 1000));
    onSnapshot(
      query(ordenesRef(), where("createdAt", ">=", desde), orderBy("createdAt", "desc")),
      (snap) => {
        ordenes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        pintarLista();
        if (seleccionada) {
          const o = ordenes.find(x => x.id === seleccionada);
          if (o) pintarCabecera(o);
        }
      },
      (err) => {
        console.error(err);
        mostrarEstado(statusBox, "Error al cargar órdenes.", "error");
      }
    );

    function pintarLista() {
      const pagada = (o) => (o.paymentStatus || "pendiente") === "pagado";
      const visibles = ordenes.filter(o => {
        if (filtro === "abiertas") return (o.status || "abierta") !== "cerrada";
        if (filtro === "pendientes") return !pagada(o);
        if (filtro === "pagadas") return pagada(o);
        return true;
      });

      if (!visibles.length) {
        reemplazar(ordenesEl, h("div", { class: "vacio" }, "No hay órdenes con este filtro."));
        return;
      }

      reemplazar(ordenesEl, visibles.map(o =>
        h("button", {
          class: "orden-card" + (o.id === seleccionada ? " seleccionada" : ""),
          onclick: () => seleccionar(o.id)
        },
          h("div", { class: "fila-entre" },
            h("span", { class: "titulo" }, "Mesa " + (o.tableNumber || "—") + (o.customerName ? " · " + o.customerName : "")),
            h("strong", {}, formatearPrecio(o.total ?? o.subtotal ?? 0))
          ),
          h("div", { class: "fila-entre", style: "margin-top:.35rem;" },
            h("span", { class: "fila" }, pildoraEstado(o.status || "abierta"), pildoraPago(o.paymentStatus)),
            h("span", { class: "meta" }, formatearFecha(o.createdAt))
          )
        )
      ));
    }

    /* ─── Detalle ─── */
    function pintarCabecera(o) {
      dTitulo.textContent = "Mesa " + (o.tableNumber || "—") + (o.customerName ? " · " + o.customerName : "");
      dMeta.textContent = `#${o.id.slice(-6)} · ${formatearFecha(o.createdAt)} · ${o.source === "cliente" ? "QR cliente" : "Mesero"}`;
      reemplazar(dPildoras, pildoraEstado(o.status || "abierta"), pildoraPago(o.paymentStatus));
    }

    async function seleccionar(id) {
      const o = ordenes.find(x => x.id === id);
      if (!o) return;
      seleccionada = id;
      pintarLista();
      detalleVacio.hidden = true;
      detalle.hidden = false;
      statusBox.hidden = true;

      pintarCabecera(o);
      pagoEstado.value = o.paymentStatus || "pendiente";
      pagoMetodo.value = o.paymentMethod || "";
      reemplazar(dItems, h("div", { class: "vacio" }, "Cargando productos…"));

      try {
        const snap = await getDocs(itemsRef(id));
        if (seleccionada !== id) return;
        let total = 0;
        const filas = snap.docs.map(d => {
          const it = d.data();
          total += importeItem(it);
          return h("div", { class: "item-fila" },
            h("div", {},
              h("div", { class: "nombre" }, (it.qty > 1 ? `${it.qty} × ` : "") + (it.productName || "Producto")),
              it.notes ? h("div", { class: "nota" }, "Nota: " + it.notes) : null
            ),
            h("span", { class: "precio" }, formatearPrecio(importeItem(it)))
          );
        });
        reemplazar(dItems, filas.length ? filas : h("div", { class: "vacio" }, "Esta orden no tiene productos."));
        totalSeleccionada = total;
        dTotal.textContent = formatearPrecio(total);

        // El total guardado puede no coincidir (p. ej. pedidos por QR): se corrige con los ítems
        if ((o.total ?? 0) !== total) {
          updateDoc(ordenRef(id), { subtotal: total, total, updatedAt: serverTimestamp() })
            .catch(err => console.error("No se pudo corregir el total:", err));
        }
      } catch (err) {
        console.error(err);
        mostrarEstado(statusBox, "Error al cargar la cuenta.", "error");
      }
    }

    /* ─── Guardar cobro ─── */
    btnGuardar.addEventListener("click", async () => {
      if (!puedeCobrar || !seleccionada) return;
      if (pagoEstado.value === "pagado" && !pagoMetodo.value) {
        mostrarEstado(statusBox, "Selecciona la forma de pago.", "error");
        return;
      }
      btnGuardar.disabled = true;
      try {
        await updateDoc(ordenRef(seleccionada), {
          paymentStatus: pagoEstado.value,
          paymentMethod: pagoMetodo.value,
          subtotal: totalSeleccionada,
          total: totalSeleccionada,
          paidAt: pagoEstado.value === "pagado" ? serverTimestamp() : null,
          updatedAt: serverTimestamp()
        });
        mostrarEstado(statusBox, "Cobro guardado.", "ok");
      } catch (err) {
        console.error(err);
        mostrarEstado(statusBox, "Error al guardar el cobro.", "error");
      } finally {
        btnGuardar.disabled = false;
      }
    });
  </script>
</body>
</html>
