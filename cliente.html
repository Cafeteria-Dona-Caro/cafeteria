<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Haz tu pedido · Café de Caro</title>
  <meta name="description" content="Pide desde tu mesa en Café de Caro.">
  <meta name="theme-color" content="#e94560">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CafeDeCaro">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/pwa.js" defer></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="index.html">
      <span class="brand-logo">☕</span>
      <div>
        <h1>Café de Caro</h1>
        <p class="sub">Elige tus productos y envía tu pedido</p>
      </div>
    </a>
  </header>

  <main id="contenido" style="max-width:720px;">
    <section class="card">
      <div class="grid-2">
        <div>
          <label for="mesaInput" style="margin-top:0;">Número de mesa</label>
          <input id="mesaInput" type="text" maxlength="20" placeholder="Ej. PB-01" autocomplete="off">
        </div>
        <div>
          <label for="nombreInput" style="margin-top:0;">Tu nombre (opcional)</label>
          <input id="nombreInput" type="text" maxlength="60" placeholder="Ej. Ana" autocomplete="given-name">
        </div>
      </div>
    </section>

    <section class="card" style="margin-top:1rem;">
      <div class="card-title">Menú</div>
      <div id="chipsCategorias" class="chips" style="margin-bottom:.75rem;"></div>
      <div id="productos"><div class="vacio">Cargando menú…</div></div>
    </section>

    <section id="carrito" class="card" style="margin-top:1rem;" hidden>
      <div class="card-title">Tu pedido</div>
      <div id="carritoItems" class="lista"></div>
      <div class="total-linea"><span>Total</span><span id="carritoTotal">$0.00</span></div>
      <button id="btnEnviar" class="btn btn-primario btn-bloque" style="margin-top:1rem;">Enviar pedido</button>
      <p class="chico tenue" style="margin:.5rem 0 0;">El pago se realiza en caja al final de tu visita.</p>
    </section>

    <div id="statusBox" class="status" hidden></div>
  </main>

  <div id="barraCarrito" class="carrito-barra" hidden>
    <div class="contenido fila-entre">
      <div>
        <div id="barraResumen" style="font-weight:600;"></div>
        <div class="chico tenue">Revisa y envía tu pedido</div>
      </div>
      <a href="#carrito" class="btn btn-primario">Ver pedido</a>
    </div>
  </div>

  <script type="module">
    import {
      db, doc, getDocs, writeBatch, serverTimestamp,
      productosRef, ordenesRef, itemsRef
    } from "./js/firebase-config.js";
    import { h, reemplazar, formatearPrecio, precioProducto, mostrarEstado } from "./js/utils.js";

    const MAX_ITEMS = 50;

    const mesaInput = document.getElementById("mesaInput");
    const nombreInput = document.getElementById("nombreInput");
    const chipsCategorias = document.getElementById("chipsCategorias");
    const productosEl = document.getElementById("productos");
    const carritoEl = document.getElementById("carrito");
    const carritoItems = document.getElementById("carritoItems");
    const carritoTotal = document.getElementById("carritoTotal");
    const btnEnviar = document.getElementById("btnEnviar");
    const statusBox = document.getElementById("statusBox");
    const barraCarrito = document.getElementById("barraCarrito");
    const barraResumen = document.getElementById("barraResumen");
    const contenido = document.getElementById("contenido");

    // La mesa puede venir en el QR: cliente.html?mesa=PB-01
    const mesaUrl = new URLSearchParams(location.search).get("mesa");
    if (mesaUrl) mesaInput.value = mesaUrl.slice(0, 20);

    let productos = [];
    let categoriaActiva = "Todas";
    let carrito = [];

    /* ─── Menú ─── */
    async function cargarMenu() {
      try {
        const snap = await getDocs(productosRef());
        productos = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .filter(p => p.isActive !== false && p.name)
          .sort((a, b) => (a.category || "").localeCompare(b.category || "") || a.name.localeCompare(b.name));
        pintarCategorias();
        pintarProductos();
      } catch (err) {
        console.error(err);
        reemplazar(productosEl, h("div", { class: "vacio" }, "No se pudo cargar el menú. Revisa tu conexión."));
      }
    }

    function pintarCategorias() {
      const categorias = ["Todas", ...new Set(productos.map(p => p.category || "Otros"))];
      reemplazar(chipsCategorias, categorias.map(c =>
        h("button", {
          class: "chip" + (c === categoriaActiva ? " activo" : ""),
          onclick: () => { categoriaActiva = c; pintarCategorias(); pintarProductos(); }
        }, c)
      ));
    }

    function pintarProductos() {
      const visibles = productos.filter(p => categoriaActiva === "Todas" || (p.category || "Otros") === categoriaActiva);
      if (!visibles.length) {
        reemplazar(productosEl, h("div", { class: "vacio" }, "No hay productos disponibles."));
        return;
      }
      const porCategoria = new Map();
      visibles.forEach(p => {
        const c = p.category || "Otros";
        if (!porCategoria.has(c)) porCategoria.set(c, []);
        porCategoria.get(c).push(p);
      });
      const nodos = [];
      for (const [cat, lista] of porCategoria) {
        nodos.push(h("h3", { class: "categoria-titulo" }, cat));
        nodos.push(h("div", { class: "productos-grid" }, lista.map(p =>
          h("button", { class: "producto-card", onclick: () => agregar(p) },
            h("span", { class: "nombre" }, p.name),
            h("span", { class: "precio" }, formatearPrecio(precioProducto(p)))
          )
        )));
      }
      reemplazar(productosEl, nodos);
    }

    /* ─── Carrito ─── */
    function agregar(p) {
      if (carrito.length >= MAX_ITEMS) {
        mostrarEstado(statusBox, `Máximo ${MAX_ITEMS} productos por pedido.`, "error");
        return;
      }
      carrito.push({ productId: p.id, productName: p.name, price: precioProducto(p), notes: "" });
      pintarCarrito();
      mostrarEstado(statusBox, `Agregado: ${p.name}`, "ok");
    }

    function pintarCarrito() {
      const hay = carrito.length > 0;
      carritoEl.hidden = !hay;
      barraCarrito.hidden = !hay;
      contenido.classList.toggle("con-carrito", hay);
      if (!hay) return;

      const total = carrito.reduce((s, it) => s + it.price, 0);
      reemplazar(carritoItems, carrito.map((it, i) => {
        const nota = h("input", {
          type: "text", maxlength: "140", placeholder: "Nota (ej. sin azúcar)",
          value: it.notes, style: "min-height:40px;margin-top:.35rem;font-size:16px;",
          oninput: (e) => { carrito[i].notes = e.target.value; }
        });
        return h("div", { class: "item-fila" },
          h("div", { style: "flex:1;min-width:0;" },
            h("div", { class: "nombre" }, it.productName),
            nota
          ),
          h("div", { class: "pila", style: "align-items:flex-end;" },
            h("span", { class: "precio" }, formatearPrecio(it.price)),
            h("button", {
              class: "btn btn-fantasma btn-sm", "aria-label": "Quitar " + it.productName,
              onclick: () => { carrito.splice(i, 1); pintarCarrito(); }
            }, "Quitar")
          )
        );
      }));
      carritoTotal.textContent = formatearPrecio(total);
      barraResumen.textContent = `${carrito.length} producto${carrito.length === 1 ? "" : "s"} · ${formatearPrecio(total)}`;
    }

    /* ─── Enviar ─── */
    btnEnviar.addEventListener("click", async () => {
      const mesa = mesaInput.value.trim();
      const nombre = nombreInput.value.trim();

      if (!mesa) {
        mostrarEstado(statusBox, "Escribe el número de tu mesa.", "error");
        mesaInput.focus();
        return;
      }
      if (!carrito.length) {
        mostrarEstado(statusBox, "Tu pedido está vacío.", "error");
        return;
      }

      btnEnviar.disabled = true;
      mostrarEstado(statusBox, "Enviando pedido…", "info");

      try {
        // Orden + ítems en escrituras por lotes. Los totales los calcula el
        // personal a partir de los ítems: las reglas de Firestore validan el
        // precio de cada ítem contra el menú. Como cada producto distinto es
        // una lectura en las reglas (máx. 20 por lote), se envían en tandas
        // de hasta 15 productos distintos.
        const orden = doc(ordenesRef());
        const lotes = [writeBatch(db)];
        let distintos = new Set();
        lotes[0].set(orden, {
          tableNumber: mesa.slice(0, 20),
          customerName: nombre.slice(0, 60),
          status: "abierta",
          source: "cliente",
          subtotal: 0,
          total: 0,
          itemsCount: carrito.length,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });
        carrito.forEach(it => {
          if (!distintos.has(it.productId) && distintos.size >= 15) {
            lotes.push(writeBatch(db));
            distintos = new Set();
          }
          distintos.add(it.productId);
          lotes[lotes.length - 1].set(doc(itemsRef(orden.id)), {
            productId: it.productId,
            productName: it.productName,
            price: it.price,
            notes: it.notes.trim().slice(0, 140),
            createdAt: serverTimestamp()
          });
        });
        for (const lote of lotes) await lote.commit();

        carrito = [];
        pintarCarrito();
        mostrarEstado(statusBox, "¡Pedido enviado! En un momento te lo llevamos.", "ok");
        window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (err) {
        console.error(err);
        mostrarEstado(statusBox, "No se pudo enviar el pedido. Revisa tu conexión o pide ayuda al mesero.", "error");
      } finally {
        btnEnviar.disabled = false;
      }
    });

    cargarMenu();
  </script>
</body>
</html>
