<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cafetería Doña Caro · Café, Frappés, Smoothies y Tisanas</title>
  <meta name="description" content="Menú de Cafetería Doña Caro, la cafetería más madrugadora. Calle Josefa Ortiz esquina con Zapata. Cafés calientes, frappés, sodas italianas, smoothies, chamoyadas y tisanas.">
  <meta name="keywords" content="cafetería doña caro, menú café, frappe, smoothies, tisanas, sodas italianas, café de olla, chamoyadas, Josefa Ortiz, Zapata">
  <meta name="theme-color" content="#e94560">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CafeDeCaro">
  <meta property="og:title" content="Cafetería Doña Caro">
  <meta property="og:description" content="La cafetería más madrugadora. Abierto de 7 am a 10 pm todos los días.">
  <meta property="og:type" content="website">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/pwa.js" defer></script>
</head>
<body>
  <section class="hero">
    <img src="img/logo.svg" alt="" width="72" height="72" style="margin-bottom:.75rem;">
    <h1>Cafetería Doña Caro</h1>
    <p class="lema">La cafetería más madrugadora, ¡vengan por su café!</p>
    <div class="datos">
      <span class="pill">📍 Calle Josefa Ortiz esq. Zapata</span>
      <span class="pill">🕖 7 am a 10 pm · todos los días</span>
    </div>
    <div class="acciones">
      <a class="btn btn-primario" href="cliente.html">Pedir desde mi mesa</a>
      <a class="btn btn-fantasma" href="https://www.facebook.com/profile.php?id=61582088720241" target="_blank" rel="noopener noreferrer">Facebook</a>
      <a class="btn btn-fantasma" href="https://www.instagram.com/cafe_de_caro" target="_blank" rel="noopener noreferrer">Instagram</a>
    </div>
  </section>

  <main>
    <div id="chips" class="chips" style="margin-bottom:1rem;"></div>
    <div id="menu" class="menu-publico"><div class="vacio">Cargando menú…</div></div>
  </main>

  <footer class="pie">
    <p>Cafetería Doña Caro · Calle Josefa Ortiz esquina con Zapata</p>
    <p><a href="login.html">Acceso del personal</a></p>
  </footer>

  <script type="module">
    import { h, reemplazar, formatearPrecio, precioProducto } from "./js/utils.js";

    const chipsEl = document.getElementById("chips");
    const menuEl = document.getElementById("menu");

    let productos = [];
    let categoriaActiva = "Todo";

    // Fuente de verdad: Firestore. Si no hay conexión o el menú está vacío,
    // se usa data/menu-inicial.json como respaldo.
    async function cargar() {
      try {
        const { getDocs, productosRef } = await import("./js/firebase-config.js");
        const snap = await getDocs(productosRef());
        productos = snap.docs.map(d => d.data());
      } catch (err) {
        console.warn("Menú desde Firestore no disponible:", err);
      }
      if (!productos.length) {
        try {
          productos = await (await fetch("data/menu-inicial.json")).json();
        } catch (err) {
          console.error(err);
        }
      }
      productos = productos
        .filter(p => p.isActive !== false && p.name)
        .sort((a, b) => (a.category || "").localeCompare(b.category || "") || a.name.localeCompare(b.name));
      pintar();
    }

    function pintar() {
      if (!productos.length) {
        reemplazar(menuEl, h("div", { class: "vacio" }, "No pudimos cargar el menú. Intenta de nuevo más tarde."));
        return;
      }
      const categorias = [...new Set(productos.map(p => p.category || "Otros"))];

      reemplazar(chipsEl, ["Todo", ...categorias].map(c =>
        h("button", {
          class: "chip" + (c === categoriaActiva ? " activo" : ""),
          onclick: () => { categoriaActiva = c; pintar(); }
        }, c)
      ));

      reemplazar(menuEl, categorias
        .filter(c => categoriaActiva === "Todo" || c === categoriaActiva)
        .map(c => h("section", { class: "card" },
          h("h2", {}, c),
          productos.filter(p => (p.category || "Otros") === c).map(p =>
            h("div", { class: "menu-item" },
              h("span", {}, p.name),
              h("span", { class: "precio" }, formatearPrecio(precioProducto(p)))
            )
          )
        ))
      );
    }

    cargar();
  </script>
</body>
</html>
